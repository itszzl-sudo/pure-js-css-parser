        css: `#scene {

    // 简化的 JSCSS 模拟渲染器
    function render() {
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      
      // 清空画布
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const html = document.getElementById('htmlInput').value;
      const css = document.getElementById('cssInput').value;
      
      // 简单的CSS解析和渲染
      renderSimple(ctx, html, css);
    }

    function renderSimple(ctx, html, css) {
      const canvasWidth = 800;
      const canvasHeight = 600;
      
      // 解析CSS
      const styles = parseCSSSimple(css);
      
      // 解析HTML并获取容器信息
      const containerStyle = styles['#container'] || styles['#scene'] || {};
      
      // 绘制背景
      if (containerStyle.background) {
        ctx.fillStyle = containerStyle.background;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      } else if (containerStyle['background-color']) {
        ctx.fillStyle = containerStyle['background-color'];
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      }
      
      // 绘制简单元素
      if (html.includes('box1') || html.includes('box2') || html.includes('box3')) {
        drawSimpleBoxes(ctx, styles);
      }
      
      if (html.includes('button')) {
        drawButtons(ctx, styles);
      }
      
      if (html.includes('card')) {
        drawCards(ctx, styles);
      }
      
      if (html.includes('gradient')) {
        drawGradients(ctx, styles);
      }
      
      if (html.includes('scene') || html.includes('sphere')) {
        drawCoolEffects(ctx, styles);
      }
    }

    function drawSimpleBoxes(ctx, styles) {
      const boxStyles = [
        styles['#box1'],
        styles['#box2'],
        styles['#box3']
      ];
      
      const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1'];
      const texts = ['Box 1', 'Box 2', 'Box 3'];
      
      let x = 30;
      let y = 200;
      
      boxStyles.forEach((style, i) => {
        if (style) {
          const width = parseInt(style.width) || 200;
          const height = parseInt(style.height) || 150;
          const bg = style.background || colors[i];
          const radius = parseInt(style['border-radius']) || 0;
          
          // 绘制阴影
          ctx.shadowColor = 'rgba(0,0,0,0.2)';
          ctx.shadowBlur = 15;
          ctx.shadowOffsetY = 5;
          
          // 绘制圆角矩形
          drawRoundRect(ctx, x, y, width, height, radius);
          ctx.fillStyle = bg;
          ctx.fill();
          
          ctx.shadowColor = 'transparent';
          
          // 绘制文字
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 20px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(texts[i], x + width/2, y + height/2);
          
          x += width + 30;
        }
      });
    }

    function drawButtons(ctx, styles) {
      const buttonStyles = [
        { class: '.primary', text: 'Primary', color: '#667eea' },
        { class: '.success', text: 'Success', color: '#38ef7d' },
        { class: '.danger', text: 'Danger', color: '#eb3b5a' },
        { class: '.warning', text: 'Warning', color: '#fa8231' }
      ];
      
      let x = 80;
      let y = 200;
      
      buttonStyles.forEach((btn, i) => {
        const width = 140;
        const height = 50;
        
        // 绘制阴影
        ctx.shadowColor = btn.color.replace(')', ', 0.4)').replace('rgb', 'rgba');
        ctx.shadowBlur = 15;
        ctx.shadowOffsetY = 4;
        
        // 绘制圆角矩形
        drawRoundRect(ctx, x, y, width, height, 25);
        ctx.fillStyle = btn.color;
        ctx.fill();
        
        ctx.shadowColor = 'transparent';
        
        // 绘制文字
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(btn.text, x + width/2, y + height/2);
        
        x += width + 40;
      });
    }

    function drawCards(ctx, styles) {
      const cardStyle = styles['.card'];
      const avatarStyle = styles['.avatar'];
      
      const cardWidth = 200;
      const cardHeight = 280;
      let x = 80;
      const y = 150;
      
      for (let i = 0; i < 3; i++) {
        // 绘制阴影
        ctx.shadowColor = 'rgba(0,0,0,0.1)';
        ctx.shadowBlur = 30;
        ctx.shadowOffsetY = 10;
        
        // 绘制卡片
        drawRoundRect(ctx, x, y, cardWidth, cardHeight, 20);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        
        ctx.shadowColor = 'transparent';
        
        // 绘制头像圆形
        const avatarX = x + cardWidth/2 - 40;
        const avatarY = y + 30;
        ctx.fillStyle = '#667eea';
        ctx.beginPath();
        ctx.arc(avatarX + 40, avatarY + 40, 40, 0, Math.PI * 2);
        ctx.fill();
        
        // 绘制标题
        ctx.fillStyle = '#333';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(['John Doe', 'Jane Smith', 'Alex Chen'][i], x + cardWidth/2, y + 140);
        
        // 绘制描述
        ctx.fillStyle = '#888';
        ctx.font = '14px Arial';
        ctx.fillText(['Developer', 'Designer', 'Manager'][i], x + cardWidth/2, y + 165);
        
        x += cardWidth + 30;
      }
    }

    function drawGradients(ctx, styles) {
      const gradientColors = [
        ['#667eea', '#764ba2'],
        ['#11998e', '#38ef7d'],
        ['#f093fb', '#f5576c'],
        ['#4facfe', '#00f2fe']
      ];
      
      let x = 100;
      const y = 200;
      const size = 170;
      
      gradientColors.forEach((colors, i) => {
        // 绘制阴影
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 25;
        ctx.shadowOffsetY = 8;
        
        // 创建渐变
        const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
        gradient.addColorStop(0, colors[0]);
        gradient.addColorStop(1, colors[1]);
        
        // 绘制圆角矩形
        drawRoundRect(ctx, x, y, size, size, 20);
        ctx.fillStyle = gradient;
        ctx.fill();
        
        ctx.shadowColor = 'transparent';
        
        x += size + 50;
      });
    }

    function drawCoolEffects(ctx, styles) {
      const canvasWidth = 800;
      const canvasHeight = 600;
      
      // 绘制背景
      const bgGradient = ctx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
      bgGradient.addColorStop(0, '#0a0e27');
      bgGradient.addColorStop(0.5, '#1a1423');
      bgGradient.addColorStop(1, '#2d1b4e');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      
      // 绘制发光球体
      const sphereGradient = ctx.createRadialGradient(350, 250, 0, 400, 300, 60);
      sphereGradient.addColorStop(0, '#ff6ec7');
      sphereGradient.addColorStop(0.5, '#7c3aed');
      sphereGradient.addColorStop(1, '#3b82f6');
      
      ctx.shadowColor = 'rgba(124, 58, 237, 0.6)';
      ctx.shadowBlur = 60;
      
      ctx.fillStyle = sphereGradient;
      ctx.beginPath();
      ctx.arc(400, 300, 60, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowColor = 'transparent';
      
      // 绘制光环
      ctx.strokeStyle = 'rgba(255, 110, 199, 0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(400, 300, 100, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.strokeStyle = 'rgba(124, 58, 237, 0.5)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(400, 300, 140, 0, Math.PI * 2);
      ctx.stroke();
      
      // 绘制宝石
      const gemColors = ['#64ffda', '#ff6ec7', '#7c3aed'];
      const gemPositions = [
        { x: 400, y: 200, size: 8 },
        { x: 480, y: 350, size: 10 },
        { x: 320, y: 380, size: 9 }
      ];
      
      gemPositions.forEach((pos, i) => {
        ctx.shadowColor = 'rgba(100, 255, 218, 0.8)';
        ctx.shadowBlur = 20;
        
        ctx.fillStyle = gemColors[i];
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y - pos.size);
        ctx.lineTo(pos.x + pos.size, pos.y - pos.size * 0.4);
        ctx.lineTo(pos.x + pos.size * 0.8, pos.y + pos.size);
        ctx.lineTo(pos.x - pos.size * 0.8, pos.y + pos.size);
        ctx.lineTo(pos.x - pos.size, pos.y - pos.size * 0.4);
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowColor = 'transparent';
      });
      
      // 绘制光晕
      ctx.fillStyle = 'rgba(255, 110, 199, 0.4)';
      ctx.beginPath();
      ctx.arc(160, 120, 75, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = 'rgba(124, 58, 237, 0.4)';
      ctx.beginPath();
      ctx.arc(620, 450, 60, 0, Math.PI * 2);
      ctx.fill();
      
      // 绘制六边形
      drawHexagon(ctx, 100, 100, 25, 'rgba(255, 110, 199, 0.3)', 'rgba(100, 255, 218, 0.5)');
      drawHexagon(ctx, 680, 480, 30, 'rgba(124, 58, 237, 0.3)', 'rgba(100, 255, 218, 0.5)');
    }

    function drawHexagon(ctx, x, y, size, fill, stroke) {
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const px = x + size * Math.cos(angle);
        const py = y + size * Math.sin(angle);
        if (i === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function parseCSSSimple(css) {
      const styles = {};
      const rules = css.split('}').filter(r => r.trim());
      
      rules.forEach(rule => {
        const parts = rule.split('{');
        if (parts.length === 2) {
          const selector = parts[0].trim();
          const properties = parts[1].split(';').filter(p => p.trim());
          const style = {};
          
          properties.forEach(prop => {
            const [key, value] = prop.split(':').map(s => s.trim());
            if (key && value) {
              style[key] = value;
            }
          });
          
          styles[selector] = style;
        }
      });
      
      return styles;
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function loadPreset(name) {
      const preset = presets[name];
      if (preset) {
        document.getElementById('htmlInput').value = preset.html;
        document.getElementById('cssInput').value = preset.css;
        render();
      }
    }

    function clearCanvas() {
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 页面加载时自动渲染
    window.onload = render;
  </script>
</body>
