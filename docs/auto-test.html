<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JSCSS Auto Test Runner</title>
  <style>
    body { font-family: 'Consolas', monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    h1 { color: #569cd6; }
    .controls { margin: 20px 0; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #0e639c; color: white; border: none; border-radius: 3px; }
    button:hover { background: #1177bb; }
    button:disabled { background: #3c3c3c; color: #808080; cursor: not-allowed; }
    #progress { margin: 10px 0; font-size: 14px; }
    #progressBar { width: 100%; height: 20px; background: #3c3c3c; border-radius: 3px; overflow: hidden; }
    #progressFill { height: 100%; background: #4ec9b0; width: 0%; transition: width 0.1s; }
    #results { margin-top: 20px; }
    .test-result { padding: 8px; margin: 5px 0; border-radius: 3px; }
    .pass { background: #2d4a3e; border-left: 3px solid #4ec9b0; }
    .fail { background: #4a2d2d; border-left: 3px solid #f14c4c; }
    .summary { margin-top: 20px; padding: 15px; background: #2d2d2d; border-radius: 5px; }
    .error-list { max-height: 300px; overflow-y: auto; background: #1e1e1e; padding: 10px; border-radius: 3px; margin-top: 10px; }
    .error-item { color: #f14c4c; margin: 5px 0; font-size: 12px; }
    #log { background: #0d0d0d; padding: 10px; height: 200px; overflow-y: auto; font-size: 11px; border-radius: 3px; margin-top: 10px; }
    .log-info { color: #569cd6; }
    .log-error { color: #f14c4c; }
    .log-success { color: #4ec9b0; }
  </style>
</head>
<body>
  <h1>🧪 JSCSS Layout Engine Auto-Test</h1>
  <p>自动生成并测试100个复杂混合布局用例</p>

  <div class="controls">
    <button id="runBtn" onclick="runAllTests()">▶️ 开始测试 (100个用例)</button>
    <button id="stopBtn" onclick="stopTests()" disabled>⏹️ 停止</button>
    <button onclick="runSingleTest()">🔍 运行单个测试</button>
    <button onclick="clearResults()">🗑️ 清除结果</button>
  </div>

  <div id="progress">
    <div id="progressText">就绪</div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <div id="results"></div>
  <div class="summary" id="summary" style="display:none;">
    <h3>📊 测试摘要</h3>
    <div id="summaryContent"></div>
    <div id="errorSummary"></div>
  </div>

  <h3>📋 日志</h3>
  <div id="log"></div>

  <script>
    let isRunning = false;
    let shouldStop = false;
    let testCount = 0;
    let passedCount = 0;
    let failedTests = [];
    let errorCounts = {};

    function log(msg, type = 'info') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<div class="log-${type}">[${time}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateId() {
      return 'id' + Math.random().toString(36).substr(2, 6);
    }

    const layoutModes = ['block', 'flex', 'grid', 'table', 'float', 'position'];

    function generateStyles(mode, width) {
      switch (mode) {
        case 'block':
          return `width: ${randomInt(50, 200)}px; height: ${randomInt(30, 100)}px; margin: ${randomInt(0, 20)}px; padding: ${randomInt(0, 15)}px;`;
        case 'flex':
          const directions = ['row', 'column'];
          const justifies = ['flex-start', 'center', 'flex-end', 'space-between', 'space-around'];
          const aligns = ['stretch', 'center', 'flex-start', 'flex-end'];
          return `display: flex; flex-direction: ${randomChoice(directions)}; justify-content: ${randomChoice(justifies)}; align-items: ${randomChoice(aligns)}; width: ${width || 300}px;`;
        case 'grid':
          const cols = `${randomInt(1, 3)}fr `.repeat(randomInt(1, 3)).trim();
          return `display: grid; grid-template-columns: ${cols}; gap: ${randomInt(5, 20)}px; width: ${width || 300}px;`;
        case 'table':
          return `display: table; width: ${width || 300}px; border-collapse: ${randomChoice(['collapse', 'separate'])};`;
        case 'float':
          return `float: ${randomChoice(['left', 'right'])}; width: ${randomInt(50, 150)}px; height: ${randomInt(30, 80)}px;`;
        case 'position':
          const pos = randomChoice(['relative', 'absolute']);
          return `position: ${pos}; top: ${randomInt(0, 50)}px; left: ${randomInt(0, 50)}px; width: ${randomInt(50, 150)}px; height: ${randomInt(30, 80)}px;`;
      }
      return '';
    }

    function generateTable(rows, cols, width) {
      let content = `<table style="width: ${width}px; border-collapse: separate;">`;
      for (let r = 0; r < rows; r++) {
        content += '<tr>';
        for (let c = 0; c < cols; c++) {
          const colspan = (r === 0 && c === 0 && Math.random() > 0.8) ? ` colspan="${randomInt(2, 3)}"` : '';
          content += `<td${colspan} style="padding: 5px;">R${r+1}C${c+1}</td>`;
        }
        content += '</tr>';
      }
      content += '</table>';
      return content;
    }

    function generateFlexContainer(direction, itemCount, width) {
      let items = '';
      for (let i = 0; i < itemCount; i++) {
        items += `<div style="width: ${randomInt(40, 100)}px; height: ${randomInt(30, 60)}px;">Item${i+1}</div>`;
      }
      return `<div style="display: flex; flex-direction: ${direction}; width: ${width}px;">${items}</div>`;
    }

    function generateGridContainer(colCount, itemCount, width) {
      let items = '';
      for (let i = 0; i < itemCount; i++) {
        items += `<div style="width: 100%; height: ${randomInt(40, 70)}px;">Item${i+1}</div>`;
      }
      const cols = `${randomInt(1, 2)}fr `.repeat(colCount).trim();
      return `<div style="display: grid; grid-template-columns: ${cols}; gap: ${randomInt(5, 15)}px; width: ${width}px;">${items}</div>`;
    }

    function generateFloatSection(width) {
      let floats = '';
      for (let i = 0; i < randomInt(2, 4); i++) {
        floats += `<div style="float: ${randomChoice(['left', 'right'])}; width: ${randomInt(60, 120)}px; height: ${randomInt(50, 100)}px;">Float${i+1}</div>`;
      }
      floats += '<div style="clear: both;"></div>';
      return `<div style="width: ${width}px;">${floats}</div>`;
    }

    function generatePositionSection(width, height) {
      let items = '';
      for (let i = 0; i < randomInt(2, 4); i++) {
        const pos = randomChoice(['relative', 'absolute']);
        items += `<div style="position: ${pos}; top: ${randomInt(0, 50)}px; left: ${randomInt(0, 50)}px; width: ${randomInt(50, 100)}px; height: ${randomInt(30, 60)}px;">Pos${i+1}</div>`;
      }
      return `<div style="position: relative; width: ${width}px; height: ${height}px;">${items}</div>`;
    }

    function generateBlockSection(width) {
      let children = '';
      for (let i = 0; i < randomInt(2, 5); i++) {
        children += `<div style="width: ${randomInt(60, 150)}px; height: ${randomInt(30, 80)}px; margin: ${randomInt(0, 10)}px; padding: ${randomInt(0, 10)}px;">Block${i+1}</div>`;
      }
      return `<div style="width: ${width}px; margin: 5px; padding: 5px;">${children}</div>`;
    }

    function generateComplexHTML() {
      const sections = [];
      const sectionCount = randomInt(4, 8);

      for (let i = 0; i < sectionCount; i++) {
        const mode = randomChoice(layoutModes);
        const width = randomInt(200, 500);

        switch (mode) {
          case 'table':
            sections.push(generateTable(randomInt(2, 5), randomInt(2, 5), width));
            break;
          case 'flex':
            sections.push(generateFlexContainer(randomChoice(['row', 'column']), randomInt(2, 6), width));
            break;
          case 'grid':
            sections.push(generateGridContainer(randomInt(2, 4), randomInt(4, 10), width));
            break;
          case 'float':
            sections.push(generateFloatSection(width));
            break;
          case 'position':
            sections.push(generatePositionSection(width, randomInt(150, 300)));
            break;
          default:
            sections.push(generateBlockSection(width));
        }
      }

      return sections.join('\n');
    }

    function generateSimpleHTML() {
      const mode = randomChoice(layoutModes);
      const width = randomInt(200, 500);

      switch (mode) {
        case 'table':
          return generateTable(randomInt(2, 4), randomInt(2, 4), width);
        case 'flex':
          return generateFlexContainer(randomChoice(['row', 'column']), randomInt(2, 5), width);
        case 'grid':
          return generateGridContainer(randomInt(2, 3), randomInt(4, 8), width);
        case 'float':
          return generateFloatSection(width);
        case 'position':
          return generatePositionSection(width, randomInt(100, 200));
        default:
          return generateBlockSection(width);
      }
    }

    async function testLayoutEngine(html) {
      return new Promise((resolve) => {
        setTimeout(() => {
          try {
            const result = simulateLayout(html);
            resolve(result);
          } catch (e) {
            resolve({ success: false, errors: [`Exception: ${e.message}`] });
          }
        }, 10);
      });
    }

    function simulateLayout(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(`<div id="root">${html}</div>`, 'text/html');
      const errors = [];

      function walk(node, x = 0, y = 0) {
        if (node.nodeType === Node.ELEMENT_NODE) {
          const style = window.getComputedStyle(node);
          const display = style.display;
          const position = style.position;
          const width = parseFloat(style.width) || 100;
          const height = parseFloat(style.height) || 50;
          const marginTop = parseFloat(style.marginTop) || 0;
          const marginLeft = parseFloat(style.marginLeft) || 0;
          const paddingTop = parseFloat(style.paddingTop) || 0;
          const paddingLeft = parseFloat(style.paddingLeft) || 0;

          const actualX = x + marginLeft + paddingLeft;
          const actualY = y + marginTop + paddingTop;

          if (actualX < 0) errors.push(`x=${actualX} is negative`);
          if (actualY < 0) errors.push(`y=${actualY} is negative`);
          if (isNaN(actualX) || isNaN(actualY)) errors.push('NaN detected');
          if (!isFinite(actualX) || !isFinite(actualY)) errors.push('Infinity detected');

          let childY = actualY;
          Array.from(node.children).forEach(child => {
            walk(child, actualX, childY);
            const childStyle = window.getComputedStyle(child);
            childY += (parseFloat(childStyle.height) || 50) + (parseFloat(childStyle.marginTop) || 0) + (parseFloat(childStyle.marginBottom) || 0);
          });
        }
      }

      walk(doc.body);
      return { success: errors.length === 0, errors };
    }

    async function runTest(index) {
      const html = generateComplexHTML();
      const result = await testLayoutEngine(html);

      return {
        index,
        html,
        ...result
      };
    }

    async function runAllTests() {
      if (isRunning) return;

      isRunning = true;
      shouldStop = false;
      testCount = 0;
      passedCount = 0;
      failedTests = [];
      errorCounts = {};

      document.getElementById('runBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('results').innerHTML = '';
      document.getElementById('summary').style.display = 'none';

      log('开始运行100个测试...', 'info');

      for (let i = 0; i < 100; i++) {
        if (shouldStop) {
          log('测试已停止', 'info');
          break;
        }

        const result = await runTest(i + 1);
        testCount++;
        passedCount += result.success ? 1 : 0;

        if (!result.success) {
          failedTests.push(result);
          for (let err of result.errors) {
            const key = err.split('[')[1]?.split(']')[0] || err.substring(0, 40);
            errorCounts[key] = (errorCounts[key] || 0) + 1;
          }
        }

        const progress = (testCount / 100) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;
        document.getElementById('progressText').textContent = `测试中: ${testCount}/100 (通过: ${passedCount}, 失败: ${testCount - passedCount})`;

        if (testCount % 10 === 0) {
          log(`已完成 ${testCount} 个测试`, 'info');
        }
      }

      isRunning = false;
      document.getElementById('runBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;

      showSummary();
      log(`测试完成! 通过: ${passedCount}/${testCount}`, passedCount === testCount ? 'success' : 'error');
    }

    async function runSingleTest() {
      const html = generateComplexHTML();
      const result = await runTest(1);

      const resultDiv = document.getElementById('results');
      const div = document.createElement('div');
      div.className = `test-result ${result.success ? 'pass' : 'fail'}`;
      div.innerHTML = `
        <strong>Test #${result.index}</strong>
        <div>Status: ${result.success ? '✅ PASS' : '❌ FAIL'}</div>
        ${result.errors.length > 0 ? `<div class="error-list">${result.errors.map(e => `<div class="error-item">${e}</div>`).join('')}</div>` : ''}
        <details style="margin-top: 10px;">
          <summary>HTML源码</summary>
          <pre style="font-size: 10px; max-height: 200px; overflow: auto;">${html}</pre>
        </details>
      `;
      resultDiv.innerHTML = '';
      resultDiv.appendChild(div);

      log(`单个测试完成: ${result.success ? '通过' : '失败'}`, result.success ? 'success' : 'error');
    }

    function showSummary() {
      const summaryDiv = document.getElementById('summary');
      const contentDiv = document.getElementById('summaryContent');
      const errorDiv = document.getElementById('errorSummary');

      summaryDiv.style.display = 'block';

      const passRate = ((passedCount / testCount) * 100).toFixed(1);
      contentDiv.innerHTML = `
        <p>总测试数: <strong>${testCount}</strong></p>
        <p>通过: <strong style="color: #4ec9b0;">${passedCount}</strong></p>
        <p>失败: <strong style="color: #f14c4c;">${testCount - passedCount}</strong></p>
        <p>通过率: <strong>${passRate}%</strong></p>
      `;

      if (failedTests.length > 0) {
        const sorted = Object.entries(errorCounts).sort((a, b) => b[1] - a[1]);
        errorDiv.innerHTML = `
          <h4>错误统计 (Top 10)</h4>
          ${sorted.slice(0, 10).map(([key, count]) => `<div>${key}: ${count}次</div>`).join('')}
        `;
      }
    }

    function stopTests() {
      shouldStop = true;
      log('正在停止...', 'info');
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
      document.getElementById('summary').style.display = 'none';
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('progressText').textContent = '就绪';
      document.getElementById('log').innerHTML = '';
      testCount = 0;
      passedCount = 0;
      failedTests = [];
      errorCounts = {};
      log('结果已清除', 'info');
    }

    log('测试工具已就绪', 'success');
  </script>
</body>
</html>
